name: Guidewire AI Guardian - QG Test

'on':
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      commit_sha:
        description: 'Commit SHA reported by Guidewire QG'
        required: false
        type: string
      qg_status:
        description: 'Final status reported by Guidewire QG'
        required: false
        type: string
      verification_id:
        description: 'Guidewire QG verification identifier'
        required: false
        type: string
      message:
        description: 'Message returned by Guidewire QG'
        required: false
        type: string
      pr_url:
        description: 'Related GitHub pull request URL'
        required: false
        type: string

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: guidewire-qg-${{ github.event.pull_request.number || github.event.inputs.commit_sha || github.run_id }}
  cancel-in-progress: true

jobs:
  # TEST PHASE: PR-triggered run performs a deliberately simple dummy validation.
  # Only after it succeeds does the next step submit SUCCESSFUL to the demo QG.
  qg-dummy-validation-and-submit:
    if: ${{ github.event_name == 'pull_request' }}
    name: Dummy validation and submit result to Guidewire QG
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout exact PR commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      # STEP 1: This is intentionally a dummy validation for integration testing.
      # Replace it with real Guidewire validation before using this beyond the demo.
      - name: Step 1 - Run dummy validation
        id: dummy_validation
        shell: bash
        run: |
          set -euo pipefail
          echo "Starting dummy validation for Guidewire QG integration test..."
          echo "Repository: $GITHUB_REPOSITORY"
          echo "PR number: ${{ github.event.pull_request.number }}"
          echo "PR commit: ${{ github.event.pull_request.head.sha }}"

          # Placeholder check: verify the checkout exists and Git can read the commit.
          test -d .git
          git rev-parse --verify HEAD

          echo "Dummy validation PASSED."
          echo "This is a test result, not a real Guidewire build or code-quality assessment."

      # STEP 2: Submit SUCCESSFUL to the existing demo QG only after Step 1 passes.
      - name: Step 2 - Submit SUCCESSFUL verification to Guidewire QG
        if: ${{ success() && steps.dummy_validation.outcome == 'success' }}
        shell: bash
        env:
          CICD_TOKEN: ${{ secrets.CICD_TOKEN }}
          COMMIT_ID: ${{ github.event.pull_request.head.sha }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          if [[ -z "${CICD_TOKEN:-}" ]]; then
            echo "::error::Missing CICD_TOKEN secret. Add it under Settings > Secrets and variables > Actions."
            exit 1
          fi

          ENDPOINT="https://cicd-manager-service.api.omega2-andromeda.guidewire.net/api/v3/tenants/valuemom/starsystems/gwcp/applications/pc/quality-gates/qg_-_ai-fw/verifications"

          BODY="$(jq -n \
            --arg commit "$COMMIT_ID" \
            --arg pr_url "$PR_URL" \
            --arg comment "TEST ONLY: dummy GitHub Actions validation passed for PR #$PR_NUMBER" \
            '{
              artifact: {
                type: "COMMIT",
                id: $commit
              },
              status: "SUCCESSFUL",
              url: $pr_url,
              comment: $comment
            }')"

          echo "Submitting test verification to Guidewire CICD Manager..."
          echo "Commit: $COMMIT_ID"
          echo "PR: $PR_URL"
          echo "Status being submitted: SUCCESSFUL (dummy validation test)"

          HTTP_CODE="$(curl --silent --show-error \
            --output qg-response.json \
            --write-out "%{http_code}" \
            --request POST \
            --url "$ENDPOINT" \
            --header "Authorization: Bearer $CICD_TOKEN" \
            --header "Content-Type: application/json" \
            --data "$BODY")"

          echo "Guidewire QG HTTP response: $HTTP_CODE"
          if [[ -s qg-response.json ]]; then
            cat qg-response.json
          fi

          if [[ ! "$HTTP_CODE" =~ ^2[0-9][0-9]$ ]]; then
            echo "::error::Guidewire QG verification request failed with HTTP $HTTP_CODE."
            exit 1
          fi

          echo "Guidewire QG accepted the SUCCESSFUL test verification."

      - name: Upload QG API response
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: guidewire-qg-test-response-${{ github.event.pull_request.number }}
          path: qg-response.json
          if-no-files-found: ignore
          retention-days: 7

  # Pipedream starts this workflow through workflow_dispatch when it receives
  # a Guidewire QG webhook callback. This job only displays the callback data.
  qg-webhook-result:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    name: Process Guidewire QG webhook result
    runs-on: ubuntu-latest
    steps:
      - name: Display Guidewire QG result
        env:
          COMMIT_SHA: ${{ inputs.commit_sha }}
          QG_STATUS: ${{ inputs.qg_status }}
          VERIFICATION_ID: ${{ inputs.verification_id }}
          QG_MESSAGE: ${{ inputs.message }}
          PR_URL: ${{ inputs.pr_url }}
        run: |
          echo "Guidewire QG callback received through Pipedream"
          echo "Commit SHA: $COMMIT_SHA"
          echo "QG status: $QG_STATUS"
          echo "Verification ID: $VERIFICATION_ID"
          echo "PR URL: $PR_URL"
          echo "Message: $QG_MESSAGE"

          if [[ -z "$QG_STATUS" ]]; then
            echo "::warning::QG status was not provided by the webhook."
          fi
