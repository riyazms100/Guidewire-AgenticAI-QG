
name: Guidewire AI Guardian - QG Test

'on':
  pull_request:
    types: [opened, synchronize, reopened]

  workflow_dispatch:
    inputs:
      commit_sha:
        description: 'Commit SHA received from Pipedream'
        required: false
        type: string

      qg_status:
        description: 'Quality Gate verification status'
        required: false
        default: 'SUCCESSFUL'
        type: string

      verification_id:
        description: 'Guidewire verification ID'
        required: false
        type: string

      message:
        description: 'Verification comment'
        required: false
        default: 'Verification passed from GitHub Actions.'
        type: string

      pr_url:
        description: 'Related Bitbucket or GitHub PR URL'
        required: false
        type: string

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: guidewire-ai-guardian-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:

  qg-dummy-validation-and-submit:

    name: Dummy Validation and QG Submission

    runs-on: ubuntu-latest

    env:
      COMMIT_SHA: ${{ inputs.commit_sha || github.event.pull_request.head.sha }}
      QG_STATUS: ${{ inputs.qg_status || 'SUCCESSFUL' }}
      PR_URL: ${{ inputs.pr_url || github.event.pull_request.html_url }}
      VERIFICATION_MESSAGE: ${{ inputs.message || 'Verification passed from GitHub Actions.' }}

    steps:

      # --------------------------------------------------
      # Checkout GitHub AI Guardian repository
      # --------------------------------------------------

      - name: Checkout Repository
        uses: actions/checkout@v4

      # --------------------------------------------------
      # STEP 1: Dummy Validation
      # --------------------------------------------------

      - name: Step 1 - Dummy Validation
        shell: bash
        run: |
          set -e

          echo "Starting Guidewire AI Guardian dummy validation..."

          if [ ! -d ".git" ]; then
            echo "ERROR: Git repository not found."
            exit 1
          fi

          if [ -z "$COMMIT_SHA" ]; then
            echo "ERROR: Commit SHA was not received."
            exit 1
          fi

          if [[ ! "$COMMIT_SHA" =~ ^[a-fA-F0-9]{40}$ ]]; then
            echo "ERROR: Invalid Git commit SHA: $COMMIT_SHA"
            exit 1
          fi

          echo "Repository validation: PASSED"
          echo "Commit SHA received: $COMMIT_SHA"
          echo "Dummy validation completed successfully."

      # --------------------------------------------------
      # STEP 2: Submit verification to Guidewire QG
      # --------------------------------------------------

      - name: Step 2 - Submit Guidewire Quality Gate Verification
        shell: bash
        env:
          CICD_TOKEN: ${{ secrets.CICD_TOKEN }}
        run: |
          set -euo pipefail

          echo "Preparing Guidewire Quality Gate verification..."

          if [ -z "$CICD_TOKEN" ]; then
            echo "ERROR: CICD_TOKEN secret is missing."
            exit 1
          fi

          if [ -z "$COMMIT_SHA" ]; then
            echo "ERROR: Commit SHA is missing."
            exit 1
          fi

          if [ -z "$PR_URL" ]; then
            echo "ERROR: Pull Request URL is missing."
            exit 1
          fi

          # Build the request body safely using jq
          REQUEST_BODY=$(jq -n \
            --arg commit "$COMMIT_SHA" \
            --arg status "$QG_STATUS" \
            --arg url "$PR_URL" \
            --arg comment "$VERIFICATION_MESSAGE" \
            '{
              artifact: {
                type: "COMMIT",
                id: $commit
              },
              status: $status,
              url: $url,
              comment: $comment
            }')

          echo "Submitting verification for commit: $COMMIT_SHA"
          echo "Verification status: $QG_STATUS"

          # Submit verification to Guidewire CICD Manager
          HTTP_CODE=$(curl --silent --show-error \
            --output response.json \
            --write-out "%{http_code}" \
            --request POST \
            "https://cicd-manager-service.api.omega2-andromeda.guidewire.net/api/v3/tenants/valuemom/starsystems/gwcp/applications/cm/quality-gates/usaaqualitygatedemo/verifications" \
            --header "Authorization: Bearer $CICD_TOKEN" \
            --header "Accept: application/json" \
            --header "Content-Type: application/json" \
            --data-binary "$REQUEST_BODY")

          echo "Guidewire API HTTP response: $HTTP_CODE"

          echo "Guidewire API response:"
          cat response.json

          # Check HTTP response
          if [[ ! "$HTTP_CODE" =~ ^2[0-9][0-9]$ ]]; then
            echo "ERROR: Guidewire verification submission failed."
            exit 1
          fi

          # Confirm returned verification status
          if ! jq -e '.status == "SUCCESSFUL"' response.json > /dev/null; then
            echo "ERROR: Guidewire did not return SUCCESSFUL status."
            exit 1
          fi

          echo "Guidewire Quality Gate verification submitted successfully."

      # --------------------------------------------------
      # STEP 3: Preserve API response
      # --------------------------------------------------

      - name: Upload Guidewire QG Response
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: guidewire-qg-verification-response
          path: response.json
          if-no-files-found: ignore
          retention-days: 7
